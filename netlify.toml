[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist_netlify"

[build.environment]
  NODE_ENV = "development"
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.4"
  PNPM_FLAGS = "--shamefully-hoist"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  VITE_SUPABASE_URL = "https://erzzqhzjtdhzrwpzbflr.supabase.co"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/booking/*"
  to = "/booking/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
