[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist_netlify"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--shamefully-hoist"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/booking/*"
  to = "/booking/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
